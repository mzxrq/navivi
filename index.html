<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/navivi.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self'; 
        connect-src 'self' ipc: http://ipc.localhost http://asset.localhost asset: https://router.project-osrm.org https://*.openstreetmap.org https://api.openrouteservice.org https://*.openrouteserivce.org https://overpass-api.de https://api.mapbox.com https://events.mapbox.com https://cyberjapandata.gsi.go.jp; 
        style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; 
        img-src 'self' data: blob: http://asset.localhost asset: https://*.cartocdn.com https://*.openstreetmap.org https://unpkg.com https://api.mapbox.com https://cyberjapandata.gsi.go.jp; 
        media-src 'self' data: blob: http://asset.localhost asset:; 
        font-src 'self' https://fonts.gstatic.com;
        worker-src 'self' blob:;
        child-src 'self' blob:;
      " />
    <title>Navivi</title>
  </head>

  <body>
    <div id="root">
      <style>
        .navivi-splash {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          color: #18181b;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          z-index: 9999;
        }
        .navivi-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid #f4f4f5;
          border-top-color: #0ea5e9; /* Sky 500 / Navi brand color */
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 24px;
        }
        .navivi-splash p {
          font-weight: 600;
          font-size: 14px;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          opacity: 0.6;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        /* Automatically switch to dark mode if system is dark */
        @media (prefers-color-scheme: dark) {
          .navivi-splash {
            background-color: #09090b; /* Zinc 950 */
            color: #f4f4f5;
          }
          .navivi-spinner {
            border-color: #27272a; /* Zinc 800 */
            border-top-color: #0ea5e9;
          }
        }
      </style>
      <div class="navivi-splash">
        <div class="navivi-spinner"></div>
        <p>Loading Workspace..</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
