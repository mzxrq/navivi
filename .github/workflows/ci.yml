name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job below runs only when its part of the repo (or this workflow) changed.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - .github/workflows/ci.yml
              - src/**
              - index.html
              - package.json
              - package-lock.json
              - tsconfig*.json
              - vite.config.ts
              - vitest.config.ts
              - lingui.config.ts
            python:
              - .github/workflows/ci.yml
              - src-tauri/src-python/**
            rust:
              - .github/workflows/ci.yml
              - src-tauri/src/**
              - src-tauri/capabilities/**
              - src-tauri/icons/**
              - src-tauri/build.rs
              - src-tauri/Cargo.*
              - src-tauri/tauri*.conf.json

  frontend:
    name: Frontend (types and tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python pipeline
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    env:
      FFMPEG_VERSION: 9.0.2
    defaults:
      run:
        working-directory: src-tauri/src-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: src-tauri/src-python/requirements-test.txt
      # The attraction, mux and TTS tests run the real ffmpeg and ffprobe; the app finds them on PATH when
      # src-python/bin has none. A pinned gyan.dev build, cached, is much quicker than Chocolatey.
      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-essentials-${{ runner.os }}
      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          $archive = "$env:RUNNER_TEMP\$name.7z"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.7z" -OutFile $archive
          7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          Move-Item "$env:RUNNER_TEMP\$name" "$HOME\ffmpeg"
      - name: Add FFmpeg to PATH
        shell: pwsh
        run: |
          "$HOME\ffmpeg\bin" >> $env:GITHUB_PATH
          & "$HOME\ffmpeg\bin\ffmpeg.exe" -version
          & "$HOME\ffmpeg\bin\ffprobe.exe" -version
      # requirements-test.txt is the app's pinned runtime list plus pytest/ruff/soundfile (see requirements-test.in).
      - run: uv pip install --system -r requirements-test.txt
      - name: Lint
        run: python -m ruff check --output-format github .
      # CI=true makes tests/conftest.py fail the run if any test was skipped.
      - name: Tests
        run: python -m pytest -q -rs

  rust:
    name: Rust shell
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # tauri::generate_context! needs the frontend folder to exist; the tests do not use it.
      - run: |
          mkdir dist
          echo "<!doctype html>" > dist/index.html
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
