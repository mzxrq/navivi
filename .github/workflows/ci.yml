name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python pipeline
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri/src-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/src-python/requirements-test.txt
      # The attraction, mux and TTS tests run the real ffmpeg and ffprobe; the app finds them on PATH when
      # src-python/bin has none.
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version
      # requirements-test.txt is the app's pinned runtime list plus pytest/ruff/soundfile (see requirements-test.in).
      - run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: python -m ruff check --output-format github .
      # CI=true makes tests/conftest.py fail the run if any test was skipped.
      - name: Tests
        run: python -m pytest -q -rs

  rust:
    name: Rust shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # tauri::generate_context! needs the frontend folder to exist; the tests do not use it.
      - run: |
          mkdir dist
          echo "<!doctype html>" > dist/index.html
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
