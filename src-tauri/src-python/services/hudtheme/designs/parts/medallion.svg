{# The round picture at the left of a mode card (circle of radius 27 at 34, 42). #}
{% if mode == "walking" %}
<circle cx="34" cy="42" r="27" fill="{{ theme.sky }}"/><path d="M8.5 51Q22 38 36 48Q48 40 59.5 51A27 27 0 0 1 8.5 51Z" fill="{{ theme.hill }}"/>{{ walker }}
{% elif mode == "ferry" %}
<circle cx="34" cy="42" r="27" fill="{{ theme.sunset }}"/><path d="M7.5 47Q14 42 21 47T34 47T47 47T60.5 47A27 27 0 0 1 7.5 47Z" fill="{{ theme.water }}"/><g transform="translate(13.5 28) scale(0.9)">{% include "parts/ferry.svg" %}</g>
{% elif mode == "driving" %}
<circle cx="34" cy="42" r="27" fill="{{ theme.sky }}"/><path d="M8 50H60A27 27 0 0 1 8 50Z" fill="{{ theme.road }}"/><path d="M14 58H22M30 58H38M46 58H54" stroke="#fff" stroke-width="2"/><g transform="translate(13.5 32) scale(0.88)">{% include "parts/driving.svg" %}</g>
{% else %}
<circle cx="34" cy="42" r="27" fill="{{ theme.sky }}"/><g fill="#fff"><circle cx="22" cy="56" r="6"/><circle cx="31" cy="58" r="7"/><circle cx="49" cy="30" r="4"/><circle cx="43" cy="31" r="3"/></g><g transform="translate(13.5 31) scale(0.88) rotate(-10 23 13)">{% include "parts/airplane.svg" %}</g>
{% endif %}
