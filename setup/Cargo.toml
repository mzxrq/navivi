[package]
name = "navivi-setup"
version = "1.0.0"
edition = "2021"
description = "Navivi's own installer and uninstaller"

[dependencies]
wry = "0.55.1"
tao = "0.35.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
winreg = "0.55"
rfd = "0.15"
windows-sys = { version = "0.60", features = ["Win32_Globalization"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
